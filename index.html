<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cocktail Menu</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>COCKTAIL MENU</h1>
            <p>CLASSIC &amp; SIGNATURE</p>
        </header>

        <div class="divider"></div>

        <!-- 칵테일 메뉴가 JavaScript로 여기에 생성됨 -->
        <div id="menu"></div>

        <footer class="footer">
            ENJOY YOUR DRINK
        </footer>

    </main>


    <!-- 칵테일 상세 정보 -->
    <div id="modal" class="modal">

        <div class="modal-background"></div>

        <div class="modal-content">

            <button id="modal-close" class="modal-close">
                ×
            </button>

            <img id="modal-image" class="modal-image" src="" alt="">

            <div class="modal-info">

                <h2 id="modal-name"></h2>

                <div id="modal-korean" class="modal-korean"></div>

                <p id="modal-description" class="modal-description"></p>

                <div class="modal-section">
                    <h3>INGREDIENTS</h3>
                    <div id="modal-ingredients"></div>
                </div>

                <div class="modal-section">
                    <h3>METHOD</h3>
                    <ol id="modal-method"></ol>
                </div>

            </div>

        </div>

    </div>


    <script src="data/cocktail.js"></script>
    <script src="js/menu.js"></script>

</body>
</html>
