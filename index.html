<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cocktail Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111111;
            color: #f5f5f5;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 45px 20px 60px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 32px;
            letter-spacing: 5px;
            font-weight: normal;
        }

        .header p {
            margin: 12px 0 0;
            color: #999;
            font-size: 12px;
            letter-spacing: 3px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #444;
            margin: 30px 0 35px;
        }

        /* Category */
        .category {
            margin-bottom: 35px;
        }

        .category-title {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 18px;

            font-size: 15px;
            color: #d6d6d6;
            letter-spacing: 2px;
        }

        .category-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #333;
        }

        /* Cocktail card */
        .cocktail-card {
            display: block;
            padding: 0;
            margin-bottom: 14px;
        
            border: 1px solid #333;
            border-radius: 8px;
        
            color: inherit;
            text-decoration: none;
        
            background: #181818;
        
            overflow: hidden;
        
            transition:
                background 0.2s,
                border-color 0.2s,
                transform 0.2s;
        }
        
        .cocktail-image {
            display: block;
        
            width: 100%;
            height: 180px;
        
            object-fit: cover;
        }
        
        .cocktail-info {
            padding: 20px;
        }

        .cocktail-card:hover {
            background: #202020;
            border-color: #666;
            transform: translateY(-2px);
        }

        .cocktail-name {
            margin: 0;

            font-family: Georgia, serif;
            font-size: 22px;
            font-weight: normal;
            letter-spacing: 2px;
        }

        .cocktail-korean {
            margin-top: 5px;

            font-size: 14px;
            color: #aaa;
        }

        .ingredients {
            margin-top: 15px;

            font-size: 12px;
            color: #888;
            letter-spacing: 0.5px;
        }

        /* Footer */
        .footer {
            margin-top: 50px;
            text-align: center;

            color: #555;
            font-size: 11px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>COCKTAIL MENU</h1>
            <p>CLASSIC &amp; SIGNATURE</p>
        </header>

        <div class="divider"></div>

        <section class="category">

            <div class="category-title">
                <span>🍸</span>
                <span>CLASSIC</span>
            </div>

            <a class="cocktail-card" href="cocktails/negroni.html">

                <img
                    class="cocktail-image"
                    src="/qr-page/brunoG.png"
                    alt="Negroni"
                >
            
                <div class="cocktail-info">
                    <h2 class="cocktail-name">BrunoG</h2>
                    <div class="cocktail-korean">말랑이s</div>
            
                    <div class="ingredients">
                        Gin · Campari · Sweet Vermouth
                    </div>
                </div>
            
            </a>

            <a class="cocktail-card" href="cocktails/old-fashioned.html">
                <h2 class="cocktail-name">OLD FASHIONED</h2>
                <div class="cocktail-korean">올드 패션드</div>

                <div class="ingredients">
                    Whiskey · Sugar · Bitters
                </div>
            </a>

        </section>

        <section class="category">

            <div class="category-title">
                <span>✨</span>
                <span>SIGNATURE</span>
            </div>

            <a class="cocktail-card" href="#">
                <h2 class="cocktail-name">COMING SOON</h2>
                <div class="cocktail-korean">새로운 칵테일</div>

                <div class="ingredients">
                    Signature Cocktail
                </div>
            </a>

        </section>

        <footer class="footer">
            ENJOY YOUR DRINK
        </footer>

    </main>

</body>
</html>
